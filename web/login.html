<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Mac-multi-server</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head><body>
<div class="auth"><div class="card">
  <span class="pill">Control plane</span>
  <div class="wordmark"><span class="dot"></span>Mac-multi-server</div>
  <p class="sub">Sign in to manage your <span class="mark">servers</span>.</p>
  {{ERROR}}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{CSRF}}">
    <label for="u">Username</label>
    <div class="inp"><input id="u" name="username" autocomplete="username" autofocus required></div>
    <label for="pw">Password</label>
    <div class="inp"><input id="pw" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="eye" aria-label="Show password" aria-pressed="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button class="go" type="submit">Sign in</button>
  </form>
</div></div>
<script src="/app.js"></script>
</body></html>
